<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NoKanri</title>

  <!-- PWA（使ってるなら） -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0b0f14">

  <style>
    :root{
      --bg:#0b0f14;
      --panel: rgba(16,24,38,0.86);
      --panel-border: rgba(255,255,255,0.06);

      --text:#e8eef6;
      --muted:#9aa7b8;

      --cell-off:#0f1826;
      --cell-off-text: rgba(232,238,246,0.40);
      --cell-off-border: rgba(255,255,255,0.05);

      --cell-on:#1f6feb;
      --cell-on-text:#ffffff;
      --cell-on-border: rgba(255,255,255,0.18);

      --danger:#d73a49;
    }

    *{ box-sizing:border-box }
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header{
      padding: 10px 12px 8px;
      position: sticky;
      top: 0;
      z-index: 10;
      background: linear-gradient(to bottom, rgba(11,15,20,0.96), rgba(11,15,20,0.78));
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .row{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap: wrap;
    }

    .card{
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 10px;
      display:flex;
      gap:10px;
      align-items:center;
    }

    input[type="date"], input[type="number"], input[type="text"]{
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      background:#0f1726;
      color: var(--text);
      outline: none;
    }

    /* 日付（メイン） */
    input[type="date"]{
      width: 170px;
      padding: 10px 12px;
      font-size: 16px;
    }

    /* 最大（内部設定・目立たない） */
    input[type="number"]{
      width: 72px;
      padding: 6px 8px;
      font-size: 13px;
      color: rgba(232,238,246,0.55);
      background: rgba(15,23,38,0.55);
      border: 1px solid rgba(255,255,255,0.04);
      opacity: .65;
    }
    input[type="number"]:focus{ opacity: .85; }

    /* 消す数字 */
    input[type="text"]{
      width: min(280px, 72vw);
      padding: 10px 12px;
      font-size: 15px;
    }

    /* 成功数 */
    .count{
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 8px 10px;
      display:flex;
      gap:8px;
      align-items: baseline;
      min-width: 86px;
      justify-content:center;
    }
    .count strong{ font-size: 18px; line-height: 1; }
    .count span{ font-size: 12px; color: var(--muted); }

    button{
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.10);
      background:#0f1726;
      color: var(--text);
      cursor:pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      white-space:nowrap;
    }

    /* 反映（小さめ） */
    button.apply{
      padding: 8px 10px;
      font-size: 13px;
      background: rgba(31,111,235,0.18);
      border-color: rgba(31,111,235,0.40);
    }

    /* リセットR（小さめ） */
    button.resetR{
      width: 34px;
      height: 34px;
      padding: 0;
      font-size: 13px;
      font-weight: 900;
      background: rgba(215,58,73,0.12);
      border-color: rgba(215,58,73,0.30);
    }

    /* エラーだけ表示（OKは出さない） */
    .msg{
      margin-top: 8px;
      font-size: 12px;
      color: rgba(215,58,73,0.95);
      display:none;
    }
    .msg.show{ display:block; }

    main{ padding: 10px 12px 14px; }

    .wrap{
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 10px;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(10, minmax(0, 1fr)); /* 常に10列 */
      gap: 7px;
      align-items: stretch;
    }

    .cell{
      user-select:none;
      -webkit-user-select:none;
      border-radius: 12px;
      border: 1px solid var(--cell-off-border);
      background: var(--cell-off);
      color: var(--cell-off-text);
      padding: 12px 0;
      text-align:center;
      font-size: 14px;
      font-weight: 800;
      line-height: 1;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;

      opacity: 0.45; /* 未選択は薄い */
    }
    .cell.on{
      background: var(--cell-on);
      color: var(--cell-on-text);
      border-color: var(--cell-on-border);
      box-shadow: 0 8px 18px rgba(31,111,235,0.20);
      opacity: 1;
    }

    /* ログ＋コピー */
    .orderRow{
      display:flex;
      gap:10px;
      align-items:stretch;
    }
    .orderLog{
      flex:1;
      min-height: 40px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(15,23,38,0.6);
      border: 1px solid rgba(255,255,255,0.05);
      color: rgba(232,238,246,0.75);
      font-size: 14px;
      line-height: 1.6;
      word-break: break-all;
    }
    .copyBtn{
      width: 76px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(31,111,235,0.14);
      border-color: rgba(31,111,235,0.32);
      color: rgba(232,238,246,0.88);
      font-size: 13px;
      padding: 10px 10px;
    }
    .copyBtn:disabled{
      opacity: .45;
      cursor: not-allowed;
    }
    .copyMsg{
      margin-top: 8px;
      font-size: 12px;
      color: rgba(232,238,246,0.55);
      display:none;
    }
    .copyMsg.show{ display:block; }
  </style>
</head>

<body>
  <header>
    <!-- 1段目：日付 + 最大（内部設定） -->
    <div class="row">
      <div class="card">
        <input id="dateInput" type="date" />
        <input id="maxNum" type="number" min="1" value="100" />
      </div>
    </div>

    <!-- 2段目：成功数 + リセット -->
    <div class="row" style="margin-top:10px;">
      <div class="count" aria-label="成功数">
        <strong id="countSuccess">0</strong><span>成功</span>
      </div>
      <button id="resetBtn" class="resetR" title="リセット">R</button>
    </div>

    <!-- 3段目：消す数字 + 反映 -->
    <div class="row" style="margin-top:10px;">
      <div class="card">
        <input id="hideInput" type="text" placeholder="消す数字：56-69, 3, 8" />
      </div>
      <button id="applyBtn" class="apply">反映</button>
    </div>

    <div id="hideMsg" class="msg"></div>
  </header>

  <main>
    <div class="wrap">
      <div id="grid" class="grid"></div>
    </div>

    <div class="wrap" style="margin-top:10px;">
      <div class="orderRow">
        <div id="orderLog" class="orderLog"></div>
        <button id="copyBtn" class="copyBtn">コピー</button>
      </div>
      <div id="copyMsg" class="copyMsg"></div>
    </div>
  </main>

  <script>
    const STORAGE_KEY = "tap-grid-state-v7";

    const elGrid = document.getElementById("grid");
    const elDate = document.getElementById("dateInput");
    const elMaxNum = document.getElementById("maxNum");
    const elHide = document.getElementById("hideInput");
    const elHideMsg = document.getElementById("hideMsg");
    const elApply = document.getElementById("applyBtn");
    const elReset = document.getElementById("resetBtn");

    const elCountSuccess = document.getElementById("countSuccess");
    const elOrderLog = document.getElementById("orderLog");
    const elCopyBtn = document.getElementById("copyBtn");
    const elCopyMsg = document.getElementById("copyMsg");

    function loadState(){
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      }catch(_){ return null; }
    }
    function saveState(state){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }
    function todayISO(){
      const d = new Date();
      return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
    }
    function defaultState(){
      return { date: todayISO(), max: 100, hide: "", on: {}, order: [] };
    }

    // 重複/かぶり/不正/範囲外はエラー
    function validateAndParseHide(text, max){
      const res = { ok:true, set:new Set(), duplicates:new Set(), invalid:[], out:[] };
      const src = (text || "").replace(/\s+/g, "");
      if(!src) return res;

      const parts = src.split(",").filter(Boolean);
      for(const token of parts){
        const r = token.match(/^(\d+)-(\d+)$/);
        if(r){
          let a = Number(r[1]), b = Number(r[2]);
          if(!Number.isFinite(a) || !Number.isFinite(b)){ res.invalid.push(token); continue; }
          if(a>b) [a,b]=[b,a];
          if(a<1 || b>max){ res.out.push(token); continue; }
          for(let n=a; n<=b; n++){
            if(res.set.has(n)) res.duplicates.add(n);
            else res.set.add(n);
          }
        }else{
          const n = Number(token);
          if(!Number.isFinite(n) || !Number.isInteger(n)){ res.invalid.push(token); continue; }
          if(n<1 || n>max){ res.out.push(token); continue; }
          if(res.set.has(n)) res.duplicates.add(n);
          else res.set.add(n);
        }
      }
      if(res.duplicates.size || res.invalid.length || res.out.length) res.ok=false;
      return res;
    }

    function getCurrentState(){
      const state = loadState() || defaultState();
      state.date = elDate.value || state.date || todayISO();
      state.max = Math.max(1, Number(elMaxNum.value || state.max || 100));
      state.hide = elHide.value ?? state.hide ?? "";
      state.on = state.on || {};
      state.order = state.order || [];
      return state;
    }

    function showError(v){
      if(v.ok){
        elHideMsg.classList.remove("show");
        elHideMsg.textContent = "";
        elApply.disabled = false;
        return;
      }
      const msgs = [];
      if(v.invalid.length) msgs.push(`不正: ${v.invalid.join(", ")}`);
      if(v.out.length) msgs.push(`範囲外(1〜${getMax()}): ${v.out.join(", ")}`);
      if(v.duplicates.size){
        const d = Array.from(v.duplicates).sort((a,b)=>a-b);
        msgs.push(`重複/かぶり: ${d.join(", ")}`);
      }
      elHideMsg.textContent = msgs.join(" / ");
      elHideMsg.classList.add("show");
      elApply.disabled = true;
    }

    function getMax(){
      return Math.max(1, Number(elMaxNum.value || 1));
    }

    function updateCount(){
      elCountSuccess.textContent = String(elGrid.querySelectorAll(".cell.on").length);
    }

    function renderOrder(state){
      const text = (state.order || []).join(", ");
      elOrderLog.textContent = text;
      elCopyBtn.disabled = text.length === 0;
    }

    function showCopyMsg(text){
      elCopyMsg.textContent = text;
      elCopyMsg.classList.add("show");
      clearTimeout(showCopyMsg._t);
      showCopyMsg._t = setTimeout(() => elCopyMsg.classList.remove("show"), 1200);
    }

    async function copyText(text){
      try{
        await navigator.clipboard.writeText(text);
        return true;
      }catch(_){}

      try{
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        ta.style.top = "0";
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand("copy");
        document.body.removeChild(ta);
        return ok;
      }catch(_){
        return false;
      }
    }

    function buildGrid(state){
      const max = state.max;
      const v = validateAndParseHide(state.hide, max);
      const hideSet = v.set;

      // 非表示/範囲外になったON/ログを掃除
      for(const k of Object.keys(state.on)){
        const n = Number(k);
        if(!Number.isFinite(n) || n < 1 || n > max || hideSet.has(n)){
          delete state.on[k];
        }
      }
      state.order = (state.order || []).filter(n => n >= 1 && n <= max && !hideSet.has(n) && state.on[n]);

      elGrid.innerHTML = "";

      for(let n=1; n<=max; n++){
        if(hideSet.has(n)) continue;

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "cell" + (state.on[n] ? " on" : "");
        btn.textContent = String(n);

        btn.addEventListener("click", () => {
          const s = getCurrentState();
          const vv = validateAndParseHide(s.hide, s.max);
          showError(vv);
          if(!vv.ok) return;

          const isOn = btn.classList.toggle("on");

          if(isOn){
            s.on[n] = true;
            if(!s.order.includes(n)) s.order.push(n); // 押した順に追加
          }else{
            delete s.on[n];
            s.order = s.order.filter(v => v !== n); // OFFで削除
          }

          saveState(s);
          updateCount();
          renderOrder(s);
        });

        elGrid.appendChild(btn);
      }

      saveState(state);
      updateCount();
      renderOrder(state);
    }

    function apply(){
      const state = getCurrentState();
      const v = validateAndParseHide(state.hide, state.max);
      showError(v);
      if(!v.ok) return;
      saveState(state);
      buildGrid(state);
    }

    function liveValidate(){
      const v = validateAndParseHide(elHide.value, getMax());
      showError(v);
    }

    (function init(){
      let state = loadState();
      if(!state){
        state = defaultState();
        saveState(state);
      }
      elDate.value = state.date || todayISO();
      elMaxNum.value = state.max ?? 100;
      elHide.value = state.hide ?? "";
      state.order = state.order || [];

      liveValidate();
      const v = validateAndParseHide(elHide.value, Number(elMaxNum.value));
      if(v.ok) buildGrid(state);
      else buildGrid({ ...state, hide: "" });
    })();

    elDate.addEventListener("change", apply);
    elMaxNum.addEventListener("input", liveValidate);
    elHide.addEventListener("input", liveValidate);
    elApply.addEventListener("click", apply);

    // Rリセット：成功（選択）＋ログを全解除
    elReset.addEventListener("click", () => {
      const state = getCurrentState();
      const v = validateAndParseHide(state.hide, state.max);
      showError(v);
      if(!v.ok) return;

      state.on = {};
      state.order = [];
      saveState(state);
      buildGrid(state);
    });

    // コピー
    elCopyBtn.addEventListener("click", async () => {
      const s = getCurrentState();
      const text = (s.order || []).join(", ");
      if(!text) return;
      const ok = await copyText(text);
      showCopyMsg(ok ? "コピーしました" : "コピー失敗（長押しで選択してコピー）");
    });

    // PWA用（入れてるなら）
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(()=>{});
    }
  </script>
</body>
</html>
